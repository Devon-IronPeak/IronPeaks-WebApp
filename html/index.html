<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron Peak - Reach Your Peak</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated mountain background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('data:image/svg+xml,<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg"><path d="M 0,300 L 200,100 L 400,180 L 600,50 L 800,150 L 1000,80 L 1200,200 L 1200,600 L 0,600 Z" fill="%23ffffff" fill-opacity="0.03"/><path d="M 0,350 L 150,200 L 350,250 L 550,150 L 750,220 L 950,140 L 1200,280 L 1200,600 L 0,600 Z" fill="%23ffffff" fill-opacity="0.05"/></svg>');
      background-size: cover;
      background-position: bottom;
      opacity: 0.6;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.2);
      max-width: 600px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .logo {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.3));
      margin-bottom: 1rem;
    }

    .mountain-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: block;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: 4rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #f4a261 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.3rem;
      font-weight: 300;
      margin-bottom: 2rem;
      opacity: 0.95;
      letter-spacing: 1px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .feature {
      flex: 1;
      min-width: 120px;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .feature:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .feature-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .feature-text {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .auth-buttons {
      margin: 2.5rem 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 15px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 150px;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Space Mono', monospace;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
      color: white;
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
    }

    .quick-access {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }

    .quick-access p {
      margin-bottom: 1rem;
      opacity: 0.9;
      font-size: 1rem;
      font-weight: 300;
    }

    .footer {
      position: fixed;
      bottom: 1rem;
      text-align: center;
      width: 100%;
      opacity: 0.7;
      font-size: 0.85rem;
      z-index: 1;
      font-weight: 300;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }

      h1 {
        font-size: 2.5rem;
      }

      .logo {
        width: 120px;
      }

      .mountain-icon {
        font-size: 3rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .features {
        flex-direction: column;
        gap: 1rem;
      }

      .feature {
        min-width: 100%;
      }

      .auth-buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    /* Subtle animations */
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
    }

    .mountain-icon {
      animation: pulse 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-container">
    <img src="logo.png" alt="Iron Peak Logo" class="logo">
    <span class="mountain-icon">🏔️</span>
  </div>

  <h1>IRON PEAK</h1>
  <p class="tagline">🏃 Reach Your Peak • Conquer Your Goals</p>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">💪</div>
      <div class="feature-text">Build Strength</div>
    </div>
    <div class="feature">
      <div class="feature-icon">🎯</div>
      <div class="feature-text">Track Progress</div>
    </div>
    <div class="feature">
      <div class="feature-icon">🏆</div>
      <div class="feature-text">Achieve Goals</div>
    </div>
  </div>

  <div class="auth-buttons">
    <a href="login.html" class="btn btn-primary">
      🚀 Login
    </a>
    <a href="signup.html" class="btn btn-secondary">
      ✨ Create Account
    </a>
  </div>

  <div class="quick-access">
    <p>Ready to train?</p>
    <a href="peak-stride.html" class="btn btn-secondary">
      🏃 Start Peak Stride
    </a>
  </div>
</div>

<div class="footer">
  © 2026 Iron Peak • Reach Your Peak 🏔️
</div>
</body>
</html>

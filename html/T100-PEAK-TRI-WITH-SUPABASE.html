<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Peak Tri - T100 Training">
    <title>Peak Tri | T100 Training Plan</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        :root {
            --tri-swim: #0EA5E9;
            --tri-bike: #F59E0B;
            --tri-run: #EF4444;
            --tri-strength: #8B5CF6;
            --tri-brick: #EC4899;
            --bg-dark: #0a0e27;
            --bg-card: #151b3d;
            --text-light: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #1e293b;
            --accent-cyan: #06b6d4;
            --success: #10b981;
            --phase1: #10b981;
            --phase2: #f59e0b;
            --phase3: #ef4444;
            --phase4: #8b5cf6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            background-attachment: fixed;
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--accent-cyan);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: white;
        }

        .navbar-logo {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.2));
            transition: transform 0.3s ease;
        }

        .navbar-logo:hover {
            transform: scale(1.05);
        }

        .navbar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--tri-swim), var(--tri-bike), var(--tri-run));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .navbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-dashboard {
            background: rgba(14, 165, 233, 0.2);
            color: var(--tri-swim);
            border: 2px solid var(--tri-swim);
        }

        .btn-dashboard:hover {
            background: var(--tri-swim);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 2px solid #ef4444;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            padding: 3rem 0 2rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--tri-swim), var(--tri-bike), var(--tri-run));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .phase-section {
            margin-bottom: 3rem;
        }

        .phase-section.collapsed .week-card {
            display: none;
        }

        .phase-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .phase-header:hover {
            opacity: 0.8;
            transform: translateX(4px);
        }

        .phase-section.collapsed .phase-header {
            margin-bottom: 0;
        }

        .phase-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .phase-icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--tri-swim), var(--tri-bike));
        }

        .phase1 .phase-icon-wrapper {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .phase2 .phase-icon-wrapper {
            background: linear-gradient(135deg, var(--tri-bike), #d97706);
        }

        .phase3 .phase-icon-wrapper {
            background: linear-gradient(135deg, var(--tri-run), #dc2626);
        }

        .phase4 .phase-icon-wrapper {
            background: linear-gradient(135deg, var(--tri-strength), #7c3aed);
        }

        .phase-info {
            flex: 1;
        }

        .phase-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-light);
        }

        .phase-icon {
            font-size: 2rem;
        }

        .week-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .week-card.collapsed .week-header {
            margin-bottom: 0;
            padding-bottom: 0.5rem;
        }

        .week-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1;
        }

        .week-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .week-compliance {
            font-size: 0.85em;
            font-weight: 600;
            color: #6b7280;
            display: none;
        }

        .week-card.collapsed .week-compliance {
            display: block;
        }

        .week-compliance.good { color: #059669; }
        .week-compliance.average { color: #d97706; }
        .week-compliance.poor { color: #dc2626; }

        .week-totals {
            display: flex;
            gap: 0.75rem;
            font-size: 0.85rem;
            align-items: center;
        }

        .week-total-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            white-space: nowrap;
        }

        .swim-badge { background: rgba(14, 165, 233, 0.2); color: var(--tri-swim); }
        .bike-badge { background: rgba(245, 158, 11, 0.2); color: var(--tri-bike); }
        .run-badge { background: rgba(239, 68, 68, 0.2); color: var(--tri-run); }

        .collapse-indicator {
            font-size: 0.8em;
            color: var(--text-dim);
            transition: transform 0.3s ease;
            margin-left: 1rem;
        }

        .week-card.collapsed .collapse-indicator {
            transform: rotate(-90deg);
        }

        .days-grid {
            display: grid;
            gap: 0.75rem;
        }

        .week-card.collapsed .days-grid {
            display: none;
        }

        .day-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .day-card:hover {
            border-color: var(--accent-cyan);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }

        .day-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent-cyan);
        }

        .day-date {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .workouts-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .workout-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .workout-item:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .workout-item.swim { border-left-color: var(--tri-swim); }
        .workout-item.bike { border-left-color: var(--tri-bike); }
        .workout-item.run { border-left-color: var(--tri-run); }
        .workout-item.strength { border-left-color: var(--tri-strength); }
        .workout-item.brick { border-left-color: var(--tri-brick); }
        .workout-item.race { border-left-color: gold; }
        .workout-item.rest { border-left-color: var(--text-dim); }

        .workout-icon {
            font-size: 1.2rem;
            min-width: 24px;
            text-align: center;
        }

        .workout-details {
            flex: 1;
        }

        .workout-type {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .workout-description {
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 0.15rem;
        }

        .workout-time {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .checkbox-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .day-card.completed {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.15));
            border-color: var(--success);
        }

        .day-card.completed .day-name,
        .day-card.completed .day-date,
        .day-card.completed .workout-type,
        .day-card.completed .workout-description {
            color: var(--text-light);
        }

        .day-card.missed {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(220, 38, 38, 0.15));
            border-color: #ef4444;
        }

        .day-card.missed .day-name,
        .day-card.missed .day-date,
        .day-card.missed .workout-type,
        .day-card.missed .workout-description {
            color: var(--text-light);
        }

        .day-card.missed::after {
            content: 'MISSED';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: rgba(239, 68, 68, 0.2);
            font-size: 2.5em;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 4px;
            font-family: 'Orbitron', sans-serif;
        }

        /* Key Workout Styling */
        .day-card.key-workout {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(6, 182, 212, 0.18));
            border-left: 4px solid var(--tri-swim);
        }

        .day-card.key-workout.completed {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.45), rgba(6, 182, 212, 0.35));
            border-color: var(--tri-swim);
            position: relative;
        }

        .day-card.key-workout.completed::after {
            content: 'KEY WORKOUT COMPLETED';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: rgba(14, 165, 233, 0.35);
            font-size: 2em;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
        }

        /* Brick Workout Styling */
        .day-card.brick-workout {
            background: 
                linear-gradient(45deg, rgba(160, 82, 45, 0.20) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(160, 82, 45, 0.20) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(160, 82, 45, 0.20) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(160, 82, 45, 0.20) 75%),
                linear-gradient(135deg, rgba(139, 69, 19, 0.25), rgba(101, 67, 33, 0.18));
            background-size: 20px 20px, 20px 20px, 20px 20px, 20px 20px, 100% 100%;
            background-position: 0 0, 10px 0, 10px -10px, 0px 10px, 0 0;
            border-left: 4px solid #8B4513;
        }

        .day-card.brick-workout.completed {
            background: 
                linear-gradient(45deg, rgba(160, 82, 45, 0.35) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(160, 82, 45, 0.35) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(160, 82, 45, 0.35) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(160, 82, 45, 0.35) 75%),
                linear-gradient(135deg, rgba(139, 69, 19, 0.45), rgba(101, 67, 33, 0.35));
            background-size: 20px 20px, 20px 20px, 20px 20px, 20px 20px, 100% 100%;
            background-position: 0 0, 10px 0, 10px -10px, 0px 10px, 0 0;
            border-color: #8B4513;
            position: relative;
        }

        .day-card.brick-workout.completed::after {
            content: 'BRICK WORKOUT COMPLETED';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: rgba(139, 69, 19, 0.35);
            font-size: 1.8em;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        /* Completed Day Styling */
        .day-card.completed:not(.key-workout):not(.brick-workout) {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.30), rgba(5, 150, 105, 0.25));
            border-color: var(--success);
            position: relative;
        }

        .day-card.completed:not(.key-workout):not(.brick-workout)::after {
            content: 'COMPLETED';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: rgba(16, 185, 129, 0.35);
            font-size: 2.5em;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 4px;
            font-family: 'Orbitron', sans-serif;
        }

        .day-card.completed .day-name,
        .day-card.completed .day-date,
        .day-card.completed .workout-type,
        .day-card.completed .workout-description {
            color: var(--text-light);
        }

        /* Partial Completion Styling - some workouts done, some missed */
        .day-card.partial-completion {
            background: linear-gradient(135deg, 
                rgba(245, 158, 11, 0.25) 0%, 
                rgba(245, 158, 11, 0.20) 50%,
                rgba(16, 185, 129, 0.20) 50%,
                rgba(16, 185, 129, 0.25) 100%);
            border-left: 4px solid #f59e0b;
            border-right: 4px solid #10b981;
            position: relative;
        }

        .day-card.partial-completion::after {
            content: 'PARTIAL';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: rgba(245, 158, 11, 0.40);
            font-size: 2.3em;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
        }

        .day-card.missed {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.28), rgba(220, 38, 38, 0.22));
            border-color: #ef4444;
        }

        .day-card.missed .day-name,
        .day-card.missed .day-date,
        .day-card.missed .workout-type,
        .day-card.missed .workout-description {
            color: var(--text-light);
        }

        .day-card.missed::after {
            content: 'MISSED';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: rgba(239, 68, 68, 0.35);
            font-size: 2.8em;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 4px;
            font-family: 'Orbitron', sans-serif;
        }

        /* Notes Section */
        .notes-section {
            display: none;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-top: 0.75rem;
        }

        .notes-section.active {
            display: block;
        }

        .notes-section textarea {
            width: 100%;
            min-height: 80px;
            padding: 0.75rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            resize: vertical;
        }

        .notes-section textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .save-note-btn {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--accent-cyan);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-note-btn:hover {
            background: var(--tri-swim);
            transform: translateY(-2px);
        }

        .notes-btn {
            padding: 0.4rem 0.8rem;
            background: rgba(100, 116, 139, 0.2);
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 0.5rem;
        }

        .notes-btn:hover {
            background: rgba(100, 116, 139, 0.3);
            color: var(--text-light);
        }

        .note-display {
            display: none;
            padding: 0.75rem;
            background: rgba(6, 182, 212, 0.1);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 6px;
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-light);
            white-space: pre-wrap;
        }

        .note-display.has-note {
            display: block;
        }

        /* Rest Day - No Checkboxes */
        .day-card.rest-day {
            background: linear-gradient(135deg, rgba(148, 163, 184, 0.08), rgba(100, 116, 139, 0.05));
            opacity: 0.85;
        }

        .day-card.rest-day .checkbox-wrapper {
            display: none;
        }

        .day-card.rest-day .miss-btn-wrapper {
            display: none;
        }

        /* Miss Button */
        .miss-btn-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .miss-btn {
            width: 20px;
            height: 20px;
            cursor: pointer;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            border-radius: 4px;
            color: transparent;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .miss-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .miss-btn.active {
            background: #ef4444;
            color: white;
        }

        .miss-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* Today Highlight */
        .today-highlight {
            border: 3px solid #2196F3 !important;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.4) !important;
            position: relative;
            overflow: visible !important;
        }
        
        .today-highlight::before {
            content: '📍';
            position: absolute;
            top: 50%;
            left: -15px;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .today-highlight::after {
            content: 'TODAY';
            position: absolute;

            const container = document.getElementById('training-plan');
            
            // Rebuild phases fresh from trainingData on every call
            const phases = {
                "Post-Marathon Transition": { icon: "🟢", weeks: [] },
                "Engine Build": { icon: "🔵", weeks: [] },
                "Peak Build": { icon: "🟣", weeks: [] },
                "Sharpen": { icon: "🟠", weeks: [] },
                "Race Week": { icon: "🔴", weeks: [] }
            };
            trainingData.forEach(week => {
                if (phases[week.phase]) phases[week.phase].weeks.push(week);
            });
            
            Object.entries(phases).forEach(([phaseName, phaseData], phaseIndex) => {

                card.classList.add('key-workout');

            );

        function updateDayCompletion(dayCard) {
            const checkboxes = dayCard.querySelectorAll('.checkbox');
            const missButtons = dayCard.querySelectorAll('.miss-btn');
            
            const totalWorkouts = checkboxes.length;
            const completedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            const missedCount = Array.from(missButtons).filter(mb => mb.classList.contains('active')).length;
            
            // Remove all state classes first
            dayCard.classList.remove('completed', 'missed', 'partial-completion');
            
            // Determine state
            if (totalWorkouts === 0) {
                // No workouts (shouldn't happen, but handle it)
                return;
            } else if (missedCount > 0 && completedCount > 0) {
                // PARTIAL: Some missed, some completed - show split state
                dayCard.classList.add('partial-completion');
            } else if (completedCount === totalWorkouts) {
                // ALL COMPLETED
                dayCard.classList.add('completed');
            } else if (missedCount > 0 && completedCount === 0) {
                // ALL MISSED (none completed)
                dayCard.classList.add('missed');
            }
            // else: neither completed nor missed - normal state
            
            // Update weekly compliance
            checkWeekCompliance();
        }

        function convertToISODate(dateStr, weekNum, dayIndex) {
            // Map weeks to start dates
            const weekStarts = [
                "2026-05-18", "2026-05-25", "2026-06-01", "2026-06-08",
                "2026-06-15", "2026-06-22", "2026-06-29", "2026-07-06",
                "2026-07-13", "2026-07-20", "2026-07-27", "2026-08-03",
                "2026-08-10"
            ];
            
            const startDate = new Date(weekStarts[weekNum - 1]);
            const targetDate = new Date(startDate);
            targetDate.setDate(startDate.getDate() + dayIndex);
            
            return targetDate.toISOString().split('T')[0];
        }

        function highlightToday() {

            const localDate = today.getFullYear() + "-" +
                String(today.getMonth()+1).padStart(2,'0') + "-" +

            document.querySelectorAll('[data-date]').forEach(el => {
                if(el.dataset.date === localDate){
                    el.classList.add('today-highlight');
                } else {
                    el.classList.remove('today-highlight');
                }
            });
        }

            const now = new Date();
            const midnight = new Date();
            midnight.setHours(24,0,0,0);
            const timeout = midnight.getTime() - now.getTime();
            setTimeout(() => { location.reload(); }, timeout);
        }

        function updateCurrentWeek() {
            const today = new Date();
            const planStart = new Date('2026-05-18');
            const diffTime = today - planStart;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const currentWeek = Math.floor(diffDays / 7) + 1;
            
            const weekEl = document.getElementById('currentWeek');
            if (weekEl && currentWeek >= 1 && currentWeek <= 13) {
                weekEl.textContent = currentWeek;
            } else if (weekEl) {
                weekEl.textContent = '--';
            }
        }

        function updateWeeksToRace() {
            const raceDate = new Date('2026-08-16');
            const today = new Date();
            const diffTime = raceDate - today;
            const diffWeeks = Math.ceil(diffTime / (1000 * 60 * 60 * 24 * 7));
            
            const weeksEl = document.getElementById('weeksToRace');
            if (weeksEl) {
                if (diffWeeks <= 0) {
                    weeksEl.innerHTML = 'RACE<br>WEEK!';
                    weeksEl.style.fontSize = '1.5rem';
                } else {
                    weeksEl.textContent = diffWeeks;
                }
            }
        }

        // Check week compliance for all weeks
        function checkWeekCompliance() {
            const today = new Date();
            const todayString = today.getFullYear() + "-" +
                String(today.getMonth()+1).padStart(2,'0') + "-" +
                String(today.getDate()).padStart(2,'0');
            
            const planStartDate = new Date('2026-05-18'); // Week 1 starts May 18
            planStartDate.setHours(0, 0, 0, 0);
            
            // Get all week cards
            const weekCards = document.querySelectorAll('.week-card');
            
            weekCards.forEach((week, weekIndex) => {
                // Calculate this week's start date
                const weekStartDate = new Date(planStartDate);
                weekStartDate.setDate(planStartDate.getDate() + (weekIndex * 7));
                
                // Get all day cards in this week (excluding rest days)
                const dayCards = week.querySelectorAll('.day-card:not(.rest-day)');
                
                let totalWorkoutsUpToToday = 0;
                let completedWorkouts = 0;
                
                dayCards.forEach((day) => {
                    const dateAttr = day.getAttribute('data-date');
                    if (!dateAttr) return;
                    
                    // Compare date strings
                    if (dateAttr <= todayString) {
                        // Count all checkboxes in this day
                        const checkboxes = day.querySelectorAll('.checkbox');
                        checkboxes.forEach(checkbox => {
                            totalWorkoutsUpToToday++;
                            if (checkbox.checked) {
                                completedWorkouts++;
                            }
                        });
                    }
                });
                
                const complianceDisplay = week.querySelector('.week-compliance');
                if (complianceDisplay) {
                    if (totalWorkoutsUpToToday > 0) {
                        const percentage = Math.round((completedWorkouts / totalWorkoutsUpToToday) * 100);
                        complianceDisplay.textContent = `Week Compliance: ${percentage}% (${completedWorkouts}/${totalWorkoutsUpToToday} completed)`;
                        
                        complianceDisplay.classList.remove('good', 'average', 'poor');
                        if (percentage >= 80) {
                            complianceDisplay.classList.add('good');
                        } else if (percentage >= 60) {
                            complianceDisplay.classList.add('average');
                        } else {
                            complianceDisplay.classList.add('poor');
                        }
                    } else {
                        complianceDisplay.textContent = '';
                        complianceDisplay.classList.remove('good', 'average', 'poor');
                    }
                }
            });
        }

        async function checkAuthAndLoadPlan() {
            if (!supabaseClient) {
                // Supabase not available, use hardcoded data
                console.log('Using hardcoded training data (Supabase not available)');
                initializePlan();
                return;
            }
            
            try {
                // Check if user is logged in
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                
                if (authError || !user) {
                    console.log('No active session found. Redirecting to login...');
                    window.location.href = 'login.html';
                    return;
                }
                
                currentUser = user;
                console.log('User authenticated:', user.email);
                
                // Fetch the training plan for this user
                const { data: planRecord, error: dbError } = await supabaseClient
                    .from('training_plans')
                    .select('*')
                    .eq('user_id', user.id)
                    .eq('plan_type', 'T100')
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .maybeSingle(); // returns null instead of error when no rows found
                
                if (dbError) {
                    console.error('Error fetching plan:', dbError.message);
                    console.log('Falling back to hardcoded training data');
                    initializePlan();
                    return;
                }
                
                if (planRecord && planRecord.plan_data) {
                    currentPlanId = planRecord.id;
                    trainingData = planRecord.plan_data;
                    // Ensure every workout has the required state fields
                    trainingData.forEach(week => {
                        week.days?.forEach(day => {
                            if (!day.notes) day.notes = '';
                            day.workouts?.forEach(w => {
                                if (w.completed === undefined) w.completed = false;
                                if (w.missed === undefined) w.missed = false;
                                if (w.notes === undefined) w.notes = '';
                            });
                        });
                    });
                    console.log('✅ T100 plan loaded from Supabase, planId:', currentPlanId);
                } else {
                    console.warn('⚠️ No T100 plan found in database for this user. Using hardcoded data. Saves will not persist until a plan record exists.');

            } catch (error) {
                console.error('Error in authentication/loading:', error);
                // Use hardcoded data as fallback
                initializePlan();
            }
        }

        // Parse a duration/distance string to a numeric value in hours (for time) or km (for distance)
        function parseAmount(str) {
            if (!str) return 0;
            str = str.toString().trim().toLowerCase();
            // Hours: "2hr", "2.5hrs", "2h", "120min", "90min"
            const hrMatch = str.match(/(\d+(?:\.\d+)?)\s*hr/);
            if (hrMatch) return parseFloat(hrMatch[1]);
            const minMatch = str.match(/(\d+(?:\.\d+)?)\s*min/);
            if (minMatch) return parseFloat(minMatch[1]) / 60;
            // Distance: "2500m", "2.5km"
            const kmMatch = str.match(/(\d+(?:\.\d+)?)\s*km/);
            if (kmMatch) return parseFloat(kmMatch[1]);
            const mMatch = str.match(/(\d+(?:\.\d+)?)\s*m\b/);
            if (mMatch) return parseFloat(mMatch[1]) / 1000;
            // Plain number
            const numMatch = str.match(/(\d+(?:\.\d+)?)/);
            if (numMatch) return parseFloat(numMatch[1]);
            return 0;
        }

        function formatAmount(val, unit) {
            if (val === 0) return `0 ${unit}`;
            if (unit === 'km') return `${Math.round(val * 10) / 10} km`;
            // hours
            if (val < 1) return `${Math.round(val * 60)}min`;
            return `${Math.round(val * 10) / 10} hrs`;
        }

        function updateTotals() {
            // Use stored weekData.totals strings for badges (accurate, from DB)
            // Re-parse descriptions for the summary section aggregate totals
            let planSwimKm = 0, planBikeHrs = 0, planRunHrs = 0;

            trainingData.forEach(weekData => {
                let weekSwimKm = 0, weekBikeHrs = 0, weekRunHrs = 0;

                weekData.days?.forEach(day => {
                    day.workouts?.forEach(w => {
                        const amt = parseAmount(w.desc);
                        if (w.type === 'swim')     weekSwimKm  += amt;
                        else if (w.type === 'bike') weekBikeHrs += amt;
                        else if (w.type === 'run')  weekRunHrs  += amt;
                    });
                });

                planSwimKm  += weekSwimKm;
                planBikeHrs += weekBikeHrs;
                planRunHrs  += weekRunHrs;

                // Update week header badges — locate card by week number in title
                document.querySelectorAll('.week-title').forEach(el => {
                    if (el.textContent.startsWith('Week ' + weekData.week + ' |')) {
                        const wc = el.closest('.week-card');
                        if (!wc) return;
                        const sb = wc.querySelector('.swim-badge');
                        const bb = wc.querySelector('.bike-badge');
                        const rb = wc.querySelector('.run-badge');
                        if (sb) sb.textContent = '\uD83C\uDFC4 ' + formatAmount(weekSwimKm, 'km');
                        if (bb) bb.textContent = '\uD83D\uDEB4 ' + formatAmount(weekBikeHrs, 'hrs');
                        if (rb) rb.textContent = '\uD83C\uDFC3 ' + formatAmount(weekRunHrs, 'hrs');
                    }
                });
            });

            // Update summary cards
            const se = document.getElementById('totalSwim');
            const be = document.getElementById('totalBike');
            const re = document.getElementById('totalRun');
            const te = document.getElementById('totalTime');
            if (se) se.textContent = formatAmount(planSwimKm, 'km');
            if (be) be.textContent = formatAmount(planBikeHrs, 'hrs');
            if (re) re.textContent = formatAmount(planRunHrs, 'hrs');
            if (te) te.textContent = '~' + Math.round(planBikeHrs + planRunHrs + planSwimKm / 2) + ' hrs';
        }
        
        async function handleWorkoutToggle(weekIndex, dayIndex, workoutIndex, toggleType) {
            // 1. Locate the workout in trainingData
            const workout = trainingData[weekIndex]?.days[dayIndex]?.workouts[workoutIndex];
            if (!workout) return;

            // 2. Update state (mutually exclusive)
            if (toggleType === 'completed') {
                workout.completed = !workout.completed;
                if (workout.completed) workout.missed = false;
            } else if (toggleType === 'missed') {
                workout.missed = !workout.missed;
                if (workout.missed) workout.completed = false;
            }

            // 3. Surgical DOM update — no full re-render, week cards stay open
            const weekNum = trainingData[weekIndex].week;
            const descEl = document.querySelector(
                '.workout-description[data-workout-id="w' + weekNum + 'd' + dayIndex + 'w' + workoutIndex + '"]'
            );
            if (descEl) {
                const workoutItem = descEl.closest('.workout-item');
                const dayCard = descEl.closest('.day-card');
                const checkbox = workoutItem && workoutItem.querySelector('.checkbox');
                const missBtn  = workoutItem && workoutItem.querySelector('.miss-btn');
                if (checkbox) checkbox.checked = workout.completed;
                if (missBtn)  missBtn.classList.toggle('active', workout.missed);
                if (dayCard)  updateDayCompletion(dayCard);
            }

            // 4. Persist to Supabase
            await savePlanToDatabase();
        }

        // Edit Mode Functionality
        const editModeBtn = document.getElementById('editModeBtn');
        let editMode = false;

        // =====================================================
        // SAVE PLAN STRUCTURE TO SUPABASE (Edit Mode)
        // =====================================================
        
        async function savePlanToDatabase() {
            if (!supabaseClient) { console.warn('savePlanToDatabase: no supabaseClient'); return; }
            if (!currentUser) { console.warn('savePlanToDatabase: not logged in'); return; }
            if (!currentPlanId) { console.warn('savePlanToDatabase: no currentPlanId'); return; }

            const { error: dbError } = await supabaseClient
                .from('training_plans')
                .update({ plan_data: trainingData })
                .eq('id', currentPlanId)
                .eq('user_id', currentUser.id);

            if (dbError) {
                console.error('T100 save error:', dbError.message);
                alert('⚠️ Failed to sync to cloud: ' + dbError.message);
            } else {
                console.log('T100 plan synced to cloud ☁️');
            }
        }

        if (editModeBtn) {
            editModeBtn.addEventListener('click', async () => {
                editMode = !editMode;
                editModeBtn.classList.toggle('active');
                
                if (!editMode) {
                    // Turning OFF edit mode - save to Supabase
                    editModeBtn.textContent = '⏳ Syncing...';
                    editModeBtn.disabled = true;
                }

                // Toggle contenteditable on all workout descriptions
                document.querySelectorAll('.workout-description').forEach(desc => {
                    if (editMode) {
                        desc.contentEditable = 'true';
                        desc.style.cursor = 'text';
                        desc.style.border = '1px dashed var(--accent-cyan)';
                        desc.style.padding = '4px';
                        desc.style.borderRadius = '4px';
                        
                        // Add key workout toggle button
                        const keyBtn = document.createElement('button');
                        keyBtn.className = 'key-toggle-btn';
                        keyBtn.textContent = desc.textContent.includes('🗝️') ? '🗝️' : '+ 🗝️';
                        keyBtn.style.cssText = 'margin-left: 8px; padding: 2px 8px; background: rgba(14, 165, 233, 0.2); border: 1px solid var(--tri-swim); border-radius: 4px; cursor: pointer; font-size: 0.85rem;';
                        keyBtn.onclick = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            if (desc.textContent.includes('🗝️')) {
                                desc.textContent = desc.textContent.replace('🗝️', '').trim();
                                keyBtn.textContent = '+ 🗝️';
                            } else {
                                desc.textContent = '🗝️ ' + desc.textContent;
                                keyBtn.textContent = '🗝️';
                            }
                            refreshDayCardClasses(desc.closest('.day-card'));
                        };
                        
                        // Add brick workout toggle button
                        const brickBtn = document.createElement('button');
                        brickBtn.className = 'brick-toggle-btn';
                        brickBtn.textContent = desc.textContent.includes('🧱') ? '🧱' : '+ 🧱';
                        brickBtn.style.cssText = 'margin-left: 4px; padding: 2px 8px; background: rgba(139, 69, 19, 0.2); border: 1px solid #8B4513; border-radius: 4px; cursor: pointer; font-size: 0.85rem;';
                        brickBtn.onclick = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            if (desc.textContent.includes('🧱')) {
                                desc.textContent = desc.textContent.replace('🧱', '').trim();
                                brickBtn.textContent = '+ 🧱';
                            } else {
                                desc.textContent = '🧱 ' + desc.textContent;
                                brickBtn.textContent = '🧱';
                            }
                            refreshDayCardClasses(desc.closest('.day-card'));
                        };
                        
                        const workoutItem = desc.closest('.workout-item');
                        if (!workoutItem.querySelector('.key-toggle-btn')) {
                            workoutItem.appendChild(keyBtn);
                        }
                        if (!workoutItem.querySelector('.brick-toggle-btn')) {
                            workoutItem.appendChild(brickBtn);
                        }
                        
                    } else {
                        desc.contentEditable = 'false';
                        desc.style.cursor = 'default';
                        desc.style.border = 'none';
                        desc.style.padding = '0';
                        
                        // Remove toggle buttons
                        const workoutItem = desc.closest('.workout-item');
                        const keyBtn = workoutItem.querySelector('.key-toggle-btn');
                        const brickBtn = workoutItem.querySelector('.brick-toggle-btn');
                        if (keyBtn) keyBtn.remove();
                        if (brickBtn) brickBtn.remove();
                    }
                });
                
                // Show/hide add/delete buttons
                document.querySelectorAll('.day-card').forEach(dayCard => {
                    if (editMode) {
                        // Add "Add Workout" button
                        if (!dayCard.querySelector('.add-workout-btn')) {
                            const addBtn = document.createElement('button');
                            addBtn.className = 'add-workout-btn';
                            addBtn.textContent = '➕ Add Workout';
                            addBtn.style.cssText = 'margin-top: 0.5rem; padding: 0.5rem 1rem; background: var(--success); color: white; border: none; border-radius: 6px; cursor: pointer; font-family: "Orbitron", sans-serif; font-size: 0.85rem;';
                            addBtn.onclick = () => addWorkout(dayCard);
                            dayCard.querySelector('.workouts-container').appendChild(addBtn);
                        }
                        
                        // Add delete buttons to each workout
                        dayCard.querySelectorAll('.workout-item').forEach(item => {
                            if (!item.querySelector('.delete-workout-btn')) {
                                const delBtn = document.createElement('button');
                                delBtn.className = 'delete-workout-btn';
                                delBtn.textContent = '🗑️';
                                delBtn.style.cssText = 'padding: 4px 8px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 4px; cursor: pointer; font-size: 1rem;';
                                delBtn.onclick = () => {
                                    item.remove();
                                    refreshDayCardClasses(dayCard);
                                };
                                item.appendChild(delBtn);
                            }
                        });
                    } else {
                        // Remove add/delete buttons
                        const addBtn = dayCard.querySelector('.add-workout-btn');
                        if (addBtn) addBtn.remove();
                        dayCard.querySelectorAll('.delete-workout-btn').forEach(btn => btn.remove());
                    }
                });

                if (!editMode) {
                    // Scrape edited descriptions back into trainingData
                    document.querySelectorAll('.workout-description[data-workout-id]').forEach(descEl => {
                        const idParts = descEl.dataset.workoutId?.match(/w(\d+)d(\d+)w(\d+)/);
                        if (!idParts) return;
                        const weekNum = parseInt(idParts[1]);
                        const dayIdx = parseInt(idParts[2]);
                        const wIdx = parseInt(idParts[3]);
                        const weekData = trainingData.find(w => w.week === weekNum);
                        if (weekData?.days?.[dayIdx]?.workouts?.[wIdx]) {
                            weekData.days[dayIdx].workouts[wIdx].desc = descEl.textContent.trim();
                        }
                    });
                    // Save updated trainingData to Supabase
                    await savePlanToDatabase();
                    updateTotals();
                    editModeBtn.disabled = false;
                    editModeBtn.textContent = '✏️ Edit Workouts';
                } else {
                    editModeBtn.textContent = '✅ Editing Mode ON';
                }
            });
        }
        
        function addWorkout(dayCard) {
            const workoutsContainer = dayCard.querySelector('.workouts-container');
            
            // Type config
            const types = {
                swim:     { icon: '🏊', label: 'Swim' },
                bike:     { icon: '🚴', label: 'Bike' },
                run:      { icon: '🏃', label: 'Run' },
                strength: { icon: '💪', label: 'Strength' },
                rest:     { icon: '😴', label: 'Rest' }
            };

            // Build selector UI
            const selectorEl = document.createElement('div');
            selectorEl.className = 'workout-type-selector';
            selectorEl.style.cssText = 'display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem; background: rgba(6,182,212,0.08); border: 1px dashed var(--accent-cyan); border-radius: 8px; margin-bottom: 0.5rem;';
            selectorEl.innerHTML = `
                <div style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.25rem;">Choose Workout Type</div>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    ${Object.entries(types).map(([key, t]) => `
                        <button data-type="${key}" style="padding: 0.4rem 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: white; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;" 
                            onmouseover="this.style.background='rgba(6,182,212,0.25)';this.style.borderColor='var(--accent-cyan)'"
                            onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.borderColor='rgba(255,255,255,0.2)'">
                            ${t.icon} ${t.label}
                        </button>
                    `).join('')}
                </div>
                <button class="cancel-add-btn" style="align-self: flex-start; padding: 0.3rem 0.7rem; background: transparent; border: 1px solid rgba(239,68,68,0.4); border-radius: 6px; color: #ef4444; cursor: pointer; font-size: 0.8rem;">✕ Cancel</button>
            `;

            const addBtn = workoutsContainer.querySelector('.add-workout-btn');
            workoutsContainer.insertBefore(selectorEl, addBtn);

            // Cancel
            selectorEl.querySelector('.cancel-add-btn').onclick = () => selectorEl.remove();

            // Type chosen
            selectorEl.querySelectorAll('[data-type]').forEach(btn => {
                btn.onclick = () => {
                    const chosenType = btn.dataset.type;
                    const { icon } = types[chosenType];
                    selectorEl.remove();

                    const newWorkoutItem = document.createElement('div');
                    newWorkoutItem.className = `workout-item ${chosenType}`;
                    newWorkoutItem.innerHTML = `
                        <span class="workout-icon">${icon}</span>
                        <div class="workout-details">
                            <div class="workout-type">${chosenType}</div>
                            <div class="workout-description" contenteditable="true" style="cursor: text; border: 1px dashed var(--accent-cyan); padding: 4px; border-radius: 4px;">New ${types[chosenType].label} workout</div>
                        </div>
                        <button class="delete-workout-btn" style="padding: 4px 8px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 4px; cursor: pointer; font-size: 1rem;">🗑️</button>
                        <div class="miss-btn-wrapper">
                            <div class="miss-btn">✗</div>
                            <span class="miss-label">Miss</span>
                        </div>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" class="checkbox">
                            <span class="checkbox-label">Done</span>
                        </div>
                    `;

                    workoutsContainer.insertBefore(newWorkoutItem, addBtn);

                    newWorkoutItem.querySelector('.delete-workout-btn').onclick = () => {
                        newWorkoutItem.remove();
                        refreshDayCardClasses(dayCard);
                    };

                    // Focus the description for immediate editing
                    newWorkoutItem.querySelector('.workout-description').focus();
                    refreshDayCardClasses(dayCard);
                };
            });
        }
        
        function refreshDayCardClasses(dayCard) {
            // Re-check key workout and brick workout status
            const workoutDescs = Array.from(dayCard.querySelectorAll('.workout-description')).map(d => d.textContent);
            
            const hasKeyWorkout = workoutDescs.some(desc => desc.includes('🗝️'));
            const hasBrickWorkout = workoutDescs.some(desc => desc.includes('🧱'));
            
            dayCard.classList.remove('key-workout', 'brick-workout');
            
            if (hasKeyWorkout) {
                dayCard.classList.add('key-workout');
            }
            if (hasBrickWorkout) {
                dayCard.classList.add('brick-workout');
            }
        }
    </script>
</body>
</html>

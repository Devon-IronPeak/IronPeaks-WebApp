<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Iron Peak</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: white;
        }

        .header {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #ff6b6b;
            color: white;
        }

        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .welcome-card h1 {
            margin: 0 0 1rem 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
        }

        .quick-actions {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .quick-actions h2 {
            margin-top: 0;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-btn {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            display: block;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Iron Peak</div>
        <div class="user-info">
            <span id="user-email">Loading...</span>
            <button class="btn btn-secondary" id="logout-btn">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">Loading your dashboard...</div>
        
        <div id="dashboard-content" class="hidden">
            <div class="welcome-card">
                <h1>Welcome back, <span id="username">User</span>! 💪</h1>
                <p>Ready to crush your fitness goals today?</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Workouts This Week</h3>
                    <div class="value">0</div>
                </div>
                <div class="stat-card">
                    <h3>Current Streak</h3>
                    <div class="value">0 days</div>
                </div>
                <div class="stat-card">
                    <h3>Total Workouts</h3>
                    <div class="value">0</div>
                </div>
                <div class="stat-card">
                    <h3>Personal Records</h3>
                    <div class="value">0</div>
                </div>
            </div>

            <div class="quick-actions">
                <h2>Quick Actions</h2>
                <div class="action-grid">
                    <a href="peak-stride.html" class="action-btn">
                        <div>🏋️</div>
                        <div>Start Workout</div>
                    </a>
                    <a href="#" class="action-btn">
                        <div>📊</div>
                        <div>View Progress</div>
                    </a>
                    <a href="#" class="action-btn">
                        <div>📝</div>
                        <div>Training Plans</div>
                    </a>
                    <a href="#" class="action-btn">
                        <div>⚙️</div>
                        <div>Settings</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Supabase JS Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Load Supabase Config -->
    <script src="supabase-config.js"></script>

    <script>
        const loadingDiv = document.getElementById('loading');
        const dashboardContent = document.getElementById('dashboard-content');
        const userEmailSpan = document.getElementById('user-email');
        const usernameSpan = document.getElementById('username');
        const logoutBtn = document.getElementById('logout-btn');

        // Check authentication status
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                // Not logged in, redirect to login
                window.location.href = 'login.html';
                return;
            }

            // User is logged in
            const user = session.user;
            userEmailSpan.textContent = user.email;
            
            // Try to get username from user metadata
            if (user.user_metadata && user.user_metadata.username) {
                usernameSpan.textContent = user.user_metadata.username;
            } else {
                // Fallback to email username
                usernameSpan.textContent = user.email.split('@')[0];
            }

            // Show dashboard
            loadingDiv.classList.add('hidden');
            dashboardContent.classList.remove('hidden');

            // Load user stats (you can implement this later with your database)
            // await loadUserStats(user.id);
        }

        // Logout function
        logoutBtn.addEventListener('click', async () => {
            logoutBtn.disabled = true;
            logoutBtn.textContent = 'Logging out...';
            
            const { error } = await supabaseClient.auth.signOut();
            
            if (error) {
                alert('Error logging out: ' + error.message);
                logoutBtn.disabled = false;
                logoutBtn.textContent = 'Logout';
            } else {
                window.location.href = 'index.html';
            }
        });

        // Listen for auth changes
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                window.location.href = 'index.html';
            }
        });

        // Initialize
        checkAuth();
    </script>
</body>
</html>

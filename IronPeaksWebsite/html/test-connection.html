<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #5568d3;
        }
        .info {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔧 Supabase Connection Test</h1>
    
    <div id="status" class="status loading">
        Testing connection...
    </div>

    <div id="details" class="info" style="display: none;">
        <h3>Connection Details:</h3>
        <p><strong>Project URL:</strong> <span id="url"></span></p>
        <p><strong>Key Format:</strong> <span id="keyFormat"></span></p>
        <p><strong>Connection Status:</strong> <span id="connectionStatus"></span></p>
    </div>

    <button onclick="location.href='index.html'" style="margin-top: 20px;">
        Go to Homepage
    </button>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        async function testConnection() {
            const statusDiv = document.getElementById('status');
            const detailsDiv = document.getElementById('details');
            const urlSpan = document.getElementById('url');
            const keyFormatSpan = document.getElementById('keyFormat');
            const connectionStatusSpan = document.getElementById('connectionStatus');

            // Show details
            detailsDiv.style.display = 'block';
            urlSpan.textContent = SUPABASE_URL;
            
            // Check key format
            if (SUPABASE_ANON_KEY.startsWith('eyJ')) {
                keyFormatSpan.textContent = '✅ Valid JWT format';
                keyFormatSpan.style.color = 'green';
            } else {
                keyFormatSpan.textContent = '❌ Invalid format';
                keyFormatSpan.style.color = 'red';
            }

            try {
                // Try to get session (this tests if connection works)
                const { data, error } = await window.supabaseClient.auth.getSession();
                
                if (error) {
                    throw error;
                }

                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <strong>✅ Connection Successful!</strong><br>
                    Your Supabase is configured correctly!<br>
                    You can now sign up and use the app.
                `;
                connectionStatusSpan.textContent = '✅ Connected';
                connectionStatusSpan.style.color = 'green';

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <strong>❌ Connection Failed</strong><br>
                    Error: ${error.message}<br><br>
                    <small>Check your Supabase credentials in supabase-config.js</small>
                `;
                connectionStatusSpan.textContent = '❌ Failed: ' + error.message;
                connectionStatusSpan.style.color = 'red';
            }
        }

        // Run test on page load
        testConnection();
    </script>
</body>
</html>
